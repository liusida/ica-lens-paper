[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icalens"
version = "0.4.0"
description = "Fit, share, and apply ICA lenses for language-model activations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Sida Liu" }, { name = "Feijiang Han" }]
keywords = ["interpretability", "ICA", "language-models", "activations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "datasets>=4.0",
    "gb10-load-llm>=0.1.2",
    "huggingface-hub>=0.25",
    "matplotlib>=3.9",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "rich>=13",
    "safetensors>=0.4",
    "torch>=2.1",
    "tqdm>=4.66",
    "transformers==5.14.1",
]

[project.optional-dependencies]
autointerpretability = [
    "openai>=1.40,<3",
]

[project.scripts]
icalens = "icalens.cli:main"

[project.urls]
Homepage = "https://liusida.github.io/ica-lens-paper/"
Documentation = "https://icalens.readthedocs.io/"
Repository = "https://github.com/liusida/ica-lens-paper"

[dependency-groups]
docs = [
    "mkdocs-material>=9,<10",
]
dev = [
    "build>=1.2",
    "datasets>=4.0",
    "gb10-load-llm>=0.1.2",
    "hatchling>=1.27",
    "mypy>=1.11",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "transformers==5.14.1",
    "types-tqdm>=4.66",
    "jupyterlab>=4.6.3",
    "ipywidgets>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icalens"]

[tool.hatch.build.targets.wheel.force-include]
"model_framing.json" = "icalens/model_framing.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["icalens"]
