site_name: ICA Lens
site_description: Interpreting language models with Independent Component Analysis
site_url: https://icalens.readthedocs.io/

repo_name: liusida/ica-lens-paper
repo_url: https://github.com/liusida/ica-lens-paper
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs-overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Text and chat: text-and-chat.md
  - Component profiles: component-profiles.md
  - Scores and energy: scores-and-energy.md
  - Steering: steering.md
  - Reconstruction: reconstruction.md
  - Fit and publish: fit-and-publish.md
  - API: api.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  alternate:
    - name: English
      link: https://icalens.readthedocs.io/en/latest/
      lang: en
    - name: 简体中文
      link: https://icalens.readthedocs.io/zh_CN/latest/
      lang: zh

watch:
  - src/icalens
